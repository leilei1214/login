<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE Login Example</title>
</head>
<body>
    <h1>LINE Login Example</h1>
    
    <!-- LINE Login Button -->
    <a href="https://access.line.me/oauth2/v2.1/authorize?response_type=code&client_id=1661291645&redirect_uri=https://leilei1214.github.io/login/index.html&state=randomstring&scope=profile%20openid&nonce=randomnonce">
        <img src="https://d.line-scdn.net/r/ti/p/button.png" alt="LINE Login">
    </a>

    <!-- Display result from LINE Login -->
    <div id="userInfo"></div>

    <script>
        // URLパラメータからLINEの認証コードを取得
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            // 認証コードをバックエンドに送信してトークンを取得
            fetch('https://api.line.me/oauth2/v2.1/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'grant_type': 'authorization_code',
                    'code': code,
                    'redirect_uri': 'https://leilei1214.github.io/login/index.html',
                    'client_id': '1661291645',
                    'client_secret': '3d1df453deb161a633a2166417b944f8',
                })
            })
            .then(response => response.json())
            .then(data => {
                // アクセストークンを使用してユーザー情報を取得
                const accessToken = data.access_token;
                fetch('https://api.line.me/v2/profile', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                })
                .then(response => response.json())
                .then(userInfo => {
                    document.getElementById('userInfo').innerHTML = `
                        <h2>LoggedID in as: ${userInfo.userId}</h2>
                        <h2>Logged in as: ${userInfo.displayName}</h2>
                        <img src="${userInfo.pictureUrl}" alt="Profile Picture">
                    `;
                });
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
