<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE Login Example</title>
</head>
<body>
    
    <!-- LINE Login Button -->

    <div class="container-scroller">
        <div class="container-fluid page-body-wrapper full-page-wrapper">
          <div class="content-wrapper d-flex align-items-center auth">
            <div class="row flex-grow">
              <div class="col-lg-4 mx-auto ">
                <div class="auth-form-light text-left p-5 ">
                  <div class="brand-logo d-flex justify-content-center">
                    <img src="assets/images/logo.png" alt="logo">
                  </div>
                  <h4 class="brand-logo d-flex justify-content-center" style="font-weight: 900;">圖斯特俱樂部活動報名系統</h4>
  
                <div class=" d-flex justify-content-center">
                  <button class="btn btn-inverse-info btn-fw d-flex justify-content-center" onclick="line_login()">
                    <img src="./assets/images/icon/icon_line.svg" alt="" style="width: 30px;margin-right: 20px;">
                    <span style="line-height: 30px;font-weight: 900;">使用line登入</span>
                </button>              
              </div>
  
                </div>
              </div>
            </div>
          </div>
          <!-- content-wrapper ends -->
        </div>
        <!-- page-body-wrapper ends -->
      </div>
    <!-- Display result from LINE Login -->
    <div id="userInfo"></div>
    <script>
        function line_login(){
            var client_id = "1661291645"
            var response_type = "code"
            var redirect_uri = "https://leilei1214.github.io/login/index.html"
            var state =  NewGuid().toUpperCase()
            const LineLoginUrl = "https://access.line.me/oauth2/v2.1/authorize?scope=profile%20openid&client_id=" + client_id + "&response_type=" + response_type + "&redirect_uri=" + redirect_uri + "&state=randomstring&nonce=randomnonce";
            window.location.href = LineLoginUrl;
        }
        const g = function () {
            return (((1 + Math.random()) * 0x10000) | 0).toString(16).substring(1);

        }
        const NewGuid = function () {
            return (g() + g() + "-" + g() + "-" + g() + "-" + g() + "-" + g() + g() + g());
        }
    </script>
    <script>
        // URLパラメータからLINEの認証コードを取得
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');

        if (code) {
            // 認証コードをバックエンドに送信してトークンを取得
            fetch('https://api.line.me/oauth2/v2.1/token', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    'grant_type': 'authorization_code',
                    'code': code,
                    'redirect_uri': 'https://leilei1214.github.io/login/index.html',
                    'client_id': '1661291645',
                    'client_secret': '3d1df453deb161a633a2166417b944f8',
                })
            })
            .then(response => response.json())
            .then(data => {
                // アクセストークンを使用してユーザー情報を取得
                const accessToken = data.access_token;
                fetch('https://api.line.me/v2/profile', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                })
                .then(response => response.json())
                .then(userInfo => {
                    document.getElementById('userInfo').innerHTML = `
                        <h2>LoggedID in as: ${userInfo.userId}</h2>
                        <h2>Logged in as: ${userInfo.displayName}</h2>
                        <img src="${userInfo.pictureUrl}" alt="Profile Picture">
                    `;
                });
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
